<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="primary" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#primary)" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Glowing Interlocking BotLend Emblem -->
  <g filter="url(#glow)">
    <!-- Left Coin Loop -->
    <circle cx="25" cy="32" r="13" stroke="url(#primary)" stroke-width="4.5" fill="none"/>
    <!-- Right Coin Loop -->
    <circle cx="39" cy="32" r="13" stroke="url(#accent)" stroke-width="4.5" fill="none"/>
    
    <!-- Central Lending Intersection Highlight -->
    <circle cx="32" cy="32" r="4.5" fill="#38bdf8"/>
    
    <!-- Dynamic Yield Arc -->
    <path d="M22 23 C28 17, 36 17, 42 23" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="43,21 44,26 39,25" fill="#67e8f9"/>
  </g>
</svg>
